[project]
name = "kse-attendance-agent"
version = "0.1.0"
description = "Agentic attendance planner: Playwright MCP + custom Schedule MCP server"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so CI and local runs agree regardless of the ruff default set.
select = ["E", "F", "W", "I", "UP", "B", "C4", "ASYNC"]
ignore = ["E501", "UP042"]
