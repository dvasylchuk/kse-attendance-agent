name: Task
description: A unit of work with a definition of done
labels: ["status:ready"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - "track:A-server"
        - "track:B-agent"
        - "track:C-docs"
        - "track:D-integration"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What needs to happen
    validations: {required: true}
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checkboxes only. A ticket without a verifiable DoD does not get merged.
      value: |
        - [ ] 
        - [ ] tests / evidence
        - [ ] docs updated in the same PR
    validations: {required: true}
  - type: input
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers, e.g. "#4 #7". Leave empty if unblocked.
